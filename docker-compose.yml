# Optional: run PostgreSQL instead of the default SQLite file.
#   docker compose up -d db
#   set DATABASE_URL=postgresql+psycopg://cyberguard:cyberguard@localhost:5432/cyberguard in .env
#   cd backend && python -m alembic upgrade head   (optional: the app also creates tables on start)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyberguard
      POSTGRES_PASSWORD: cyberguard   # demo only - change for anything but a laptop
      POSTGRES_DB: cyberguard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
