# Render Blueprint: the NovaMart API. The web pages live on Netlify (see netlify.toml).
services:
  - type: web
    name: novamart-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # the Netlify address that is allowed to call this API
      - key: CORS_ORIGINS
        value: https://novamart-security-centre.netlify.app
      - key: BRAND_NAME
        value: NovaMart
      - key: TELEMETRY_ENABLED
        value: "true"
      # secrets: set these in the Render dashboard, never in git
      - key: DEMO_EMAIL          # staff sign-in codes are sent here
        sync: false
      - key: RESEND_API_KEY      # e-mail over HTTPS (free Render servers block SMTP)
        sync: false
      - key: OTP_DEV_ECHO        # "true" shows codes on screen instead of e-mailing them; keep "false" once e-mail works
        value: "false"
      # demo passwords are generated by Render; read them in the dashboard under Environment
      - key: CG_ADMIN_PASSWORD
        generateValue: true
      - key: CG_ANALYST_PASSWORD
        generateValue: true
      - key: CG_VIEWER_PASSWORD
        generateValue: true
      - key: CG_SHOPPER_PASSWORD
        generateValue: true
